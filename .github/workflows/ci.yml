# CI (Fases 9 y 11). Backend: compilacion con analizadores (advertencias = errores), pruebas unitarias,
# funcionales e integracion con SQL Server real (Testcontainers) y paquetes vulnerables. Frontend: tipos, Vitest y build.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend:
    name: Build y pruebas (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TIAdmin.slnx

      - name: Build (Release, advertencias como errores)
        run: dotnet build TIAdmin.slnx --configuration Release --no-restore

      - name: Paquetes vulnerables
        run: |
          dotnet list TIAdmin.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qiE "has the following vulnerable packages|tiene los siguientes paquetes vulnerables" vulnerable.txt; then
            echo "::error::Se encontraron paquetes NuGet con vulnerabilidades conocidas."
            exit 1
          fi

      - name: Pruebas (unitarias, funcionales e integracion con SQL Server)
        run: >
          dotnet test TIAdmin.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  frontend:
    name: Build y pruebas (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ti-admin-web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ti-admin-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Permisos sincronizados con Permissions.cs
        run: |
          npm run api:permissions
          git diff --exit-code src/app/core/auth/permissions.generated.ts || {
            echo "::error::permissions.generated.ts no coincide con Permissions.cs. Ejecute 'npm run api:permissions'."
            exit 1
          }

      - name: Tipos (tsc estricto)
        run: npm run lint:types

      - name: Pruebas unitarias (Vitest)
        run: npx ng test --watch=false

      - name: Build de produccion
        run: npm run build

      - name: Dependencias vulnerables
        run: npm audit --omit=dev --audit-level=high
