# CI del backend (Fase 11): compilacion con analizadores (advertencias = errores), pruebas unitarias,
# funcionales e integracion con SQL Server real (Testcontainers) y revision de paquetes vulnerables.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend:
    name: Build y pruebas (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TIAdmin.slnx

      - name: Build (Release, advertencias como errores)
        run: dotnet build TIAdmin.slnx --configuration Release --no-restore

      - name: Paquetes vulnerables
        run: |
          dotnet list TIAdmin.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qiE "has the following vulnerable packages|tiene los siguientes paquetes vulnerables" vulnerable.txt; then
            echo "::error::Se encontraron paquetes NuGet con vulnerabilidades conocidas."
            exit 1
          fi

      - name: Pruebas (unitarias, funcionales e integracion con SQL Server)
        run: >
          dotnet test TIAdmin.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14
